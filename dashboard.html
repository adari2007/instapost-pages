<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaAutoPost — Dashboard</title>
<!-- __EDGE_CONFIG__ -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .ig-gradient { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
  .ring-selected { outline: 3px solid #3b82f6; outline-offset: 2px; }
  .fade-out { opacity: 0; transition: opacity 0.4s ease; }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<div class="ig-gradient shadow-md sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-white font-bold text-lg leading-none">📸 InstaAutoPost</h1>
      <p id="last-refresh" class="text-white/60 text-xs mt-0.5">Loading…</p>
    </div>
    <div class="flex gap-2">
      <button onclick="loadAll()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
        ↺ Refresh
      </button>
      <button onclick="approveAll()" id="approve-all-btn"
              class="bg-white text-purple-700 text-xs px-4 py-1.5 rounded-lg font-bold shadow hover:bg-gray-50 transition">
        ✓ Approve All
      </button>
    </div>
  </div>
</div>

<!-- Stats bar -->
<div class="max-w-3xl mx-auto px-4 mt-4">
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div class="bg-white rounded-xl p-4 shadow-sm text-center border border-gray-100">
      <div id="stat-total" class="text-2xl font-bold text-gray-800">—</div>
      <div class="text-xs text-gray-400 mt-1">Photos in Drive</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm text-center border border-gray-100">
      <div id="stat-posted" class="text-2xl font-bold text-gray-800">—</div>
      <div class="text-xs text-gray-400 mt-1">Posted</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm text-center border border-gray-100">
      <div id="stat-available" class="text-2xl font-bold text-gray-800">—</div>
      <div class="text-xs text-gray-400 mt-1">Available</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm text-center border border-gray-100">
      <div id="stat-days" class="text-2xl font-bold text-gray-800">—</div>
      <div class="text-xs text-gray-400 mt-1">Days Remaining</div>
    </div>
  </div>
</div>

<!-- Tab nav -->
<div class="max-w-3xl mx-auto px-4 mt-5">
  <div class="flex gap-1 bg-gray-100 rounded-xl p-1 w-fit">
    <button id="tab-upcoming" onclick="switchTab('upcoming')"
            class="tab-btn text-sm font-semibold px-5 py-2 rounded-lg bg-white shadow-sm text-gray-800 transition">
      Upcoming
    </button>
    <button id="tab-history" onclick="switchTab('history')"
            class="tab-btn text-sm font-medium px-5 py-2 rounded-lg text-gray-400 hover:text-gray-600 transition">
      History
    </button>
  </div>
</div>

<!-- Upcoming Posts -->
<div class="max-w-3xl mx-auto px-4 mt-4 pb-16" id="posts-container">
  <div class="text-center py-20 text-gray-300">
    <div class="text-5xl mb-3">⏳</div>
    <div class="text-sm">Loading posts…</div>
  </div>
</div>

<!-- History -->
<div class="max-w-3xl mx-auto px-4 mt-4 pb-16 hidden" id="history-container">
  <div class="text-center py-20 text-gray-300">
    <div class="text-5xl mb-3">📦</div>
    <div class="text-sm">Loading history…</div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50 pointer-events-none"></div>

<script>
// Config: injected by Edge Function, or read from URL hash (Storage-hosted), or local Flask fallback
const _hash = new URLSearchParams(window.location.hash.slice(1));
const API = window.__API_BASE__ || _hash.get('api') || sessionStorage.getItem('dash_api') || '/api/dashboard';
const _AUTH = window.__DASHBOARD_TOKEN__ || _hash.get('token') || sessionStorage.getItem('dash_token') || '';
if (_AUTH) sessionStorage.setItem('dash_token', _AUTH);
if (API && API !== '/api/dashboard') sessionStorage.setItem('dash_api', API);
function apiFetch(url, opts) {
  opts = opts || {};
  if (_AUTH) opts = {...opts, headers: {Authorization: 'Bearer ' + _AUTH, ...(opts.headers || {})}};
  return fetch(url, opts);
}

let postsCache = {};

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadAll);
let currentTab = 'upcoming';

function loadAll() {
  loadPosts();
  loadStats();
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('posts-container').classList.toggle('hidden', tab !== 'upcoming');
  document.getElementById('history-container').classList.toggle('hidden', tab !== 'history');

  document.getElementById('tab-upcoming').className =
    'tab-btn text-sm px-5 py-2 rounded-lg transition ' +
    (tab === 'upcoming' ? 'font-semibold bg-white shadow-sm text-gray-800' : 'font-medium text-gray-400 hover:text-gray-600');
  document.getElementById('tab-history').className =
    'tab-btn text-sm px-5 py-2 rounded-lg transition ' +
    (tab === 'history' ? 'font-semibold bg-white shadow-sm text-gray-800' : 'font-medium text-gray-400 hover:text-gray-600');

  if (tab === 'history') loadHistory();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const r = await apiFetch(API + '/stats');
    const s = await r.json();
    document.getElementById('stat-total').textContent = s.total ?? '—';
    document.getElementById('stat-posted').textContent = s.posted ?? '—';
    document.getElementById('stat-available').textContent = s.available ?? '—';
    document.getElementById('stat-days').textContent =
      s.days_remaining != null ? s.days_remaining + 'd' : '—';
  } catch (e) { /* stats are optional */ }
}

// ── Upcoming posts (grouped by day → by slot) ─────────────────────────────────
async function loadPosts() {
  const container = document.getElementById('posts-container');
  try {
    const r = await apiFetch(API + '/posts');
    const posts = await r.json();
    postsCache = {};
    posts.forEach(p => { postsCache[p.id] = p; });

    document.getElementById('last-refresh').textContent =
      'Updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});

    if (!posts.length) {
      container.innerHTML = `
        <div class="text-center py-20 text-gray-300">
          <div class="text-5xl mb-3">✨</div>
          <div class="text-sm">No upcoming posts</div>
        </div>`;
      return;
    }

    // Group by calendar date
    const byDay = {};
    posts.forEach(p => {
      const day = new Date(p.scheduled_at).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', timeZone:'America/Chicago'});
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(p);
    });

    let html = '';
    for (const [day, dayPosts] of Object.entries(byDay)) {
      html += `<div class="mb-2 mt-1">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">${day}</h2>`;

      // Group by slot within the day
      const slots = {};
      dayPosts.forEach(p => {
        const label = 'Slot ' + (p.slot + 1);
        if (!slots[label]) slots[label] = [];
        slots[label].push(p);
      });

      for (const [slotLabel, slotPosts] of Object.entries(slots)) {
        const t = new Date(slotPosts[0].scheduled_at).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:'America/Chicago'});
        html += `<div class="mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs font-semibold text-gray-500">${slotLabel}</span>
            <span class="text-gray-300 text-xs">·</span>
            <span class="text-xs text-gray-400">${t}</span>
          </div>
          ${slotPosts.map(renderCard).join('')}
        </div>`;
      }
      html += `</div>`;
    }
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">Failed to load posts</div>`;
  }
}

// ── History ───────────────────────────────────────────────────────────────────
let historyLoaded = false;
async function loadHistory() {
  if (historyLoaded) return;
  const container = document.getElementById('history-container');
  try {
    const r = await apiFetch(API + '/history');
    const posts = await r.json();
    historyLoaded = true;

    if (!posts.length) {
      container.innerHTML = `
        <div class="text-center py-20 text-gray-300">
          <div class="text-5xl mb-3">📭</div>
          <div class="text-sm">No posts yet</div>
        </div>`;
      return;
    }

    // Group by calendar date (newest first)
    const byDay = {};
    posts.forEach(p => {
      const day = new Date(p.scheduled_at).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', timeZone:'America/Chicago'});
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(p);
    });

    let html = '';
    for (const [day, dayPosts] of Object.entries(byDay)) {
      html += `<div class="mb-6">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">${day}</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          ${dayPosts.map(renderHistoryCard).join('')}
        </div>
      </div>`;
    }
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">Failed to load history</div>`;
  }
}

function renderHistoryCard(p) {
  const t = new Date(p.scheduled_at).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:'America/Chicago'});
  const cap = p.caption || {};
  const isFailed = p.status === 'failed';
  return `
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
      <div class="relative">
        <img src="${esc(p.preview_url)}" class="w-full aspect-square object-cover bg-gray-100" />
        <span class="absolute top-2 right-2 text-xs px-2 py-0.5 rounded-full font-medium
                     ${isFailed ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-700'}">
          ${isFailed ? '✗ Failed' : '📤 Posted'}
        </span>
      </div>
      <div class="p-3">
        <p class="text-xs font-medium text-gray-500 mb-1">Slot ${p.slot + 1} · ${t}</p>
        <p class="text-xs text-gray-700 leading-relaxed line-clamp-3">${esc(cap.caption || '—')}</p>
        ${cap.location_name ? `<p class="text-xs text-gray-400 mt-1">📍 ${esc(cap.location_name)}</p>` : ''}
      </div>
    </div>`;
}

// ── Card renderer ─────────────────────────────────────────────────────────────
function renderCard(p) {
  const dt = new Date(p.scheduled_at);
  const dateStr = dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', timeZone:'America/Chicago'});
  const timeStr = dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:'America/Chicago'});

  const badges = {
    pending:  'bg-yellow-100 text-yellow-700',
    approved: 'bg-green-100 text-green-700',
    posted:   'bg-blue-100 text-blue-700',
    failed:   'bg-red-100 text-red-600',
  };
  const badgeLabels = {
    pending: '● Pending', approved: '✓ Approved', posted: '📤 Posted', failed: '✗ Failed',
  };
  const badgeCls = badges[p.status] || 'bg-gray-100 text-gray-500';
  const badgeLabel = badgeLabels[p.status] || p.status;

  const cap = p.caption || {};
  const hashtags = (cap.hashtags || []).join(' ');
  const location = cap.location_name || '';
  const primaryOpt = p.options.find(o => o.photo_id === p.selected_photo_id) || p.options[0] || {};

  const thumbs = p.options.map(o => {
    const sel = o.photo_id === p.selected_photo_id;
    return `<img src="${esc(o.preview_url)}"
                 data-photo="${esc(o.photo_id)}"
                 onclick="selectPhoto('${esc(p.id)}','${esc(o.photo_id)}')"
                 title="${esc(o.location || '')}"
                 class="w-16 h-16 object-cover rounded-lg cursor-pointer transition ${sel ? 'ring-selected' : 'opacity-60 hover:opacity-100'}"
                 id="thumb-${esc(p.id)}-${esc(o.photo_id)}" />`;
  }).join('');

  const musicHtml = p.music
    ? `<p class="text-xs text-purple-500 mt-1.5">🎵 ${esc(p.music.name)} · ${esc(p.music.artist)}</p>`
    : '';

  const approveBtn = p.status === 'pending' ? `
    <button onclick="approvePost('${esc(p.id)}')" id="btn-approve-${esc(p.id)}"
            class="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition">
      ✓ Approve
    </button>` : '';
  const skipBtn = ['pending', 'approved'].includes(p.status) ? `
    <button onclick="skipPost('${esc(p.id)}')"
            class="text-xs px-3 py-1.5 bg-white hover:bg-red-50 text-red-500 border border-red-200 rounded-lg font-medium transition">
      ✕ Skip
    </button>` : '';
  const actionBtns = approveBtn + skipBtn;

  return `
<div id="card-${esc(p.id)}" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4 transition-all">

  <!-- Card header -->
  <div class="px-5 py-3 flex items-center justify-between border-b border-gray-100">
    <div class="flex items-center gap-2 min-w-0">
      <span class="font-semibold text-gray-800 text-sm">Post ${p.slot + 1}</span>
      <span class="text-gray-300 text-sm">·</span>
      <span class="text-gray-500 text-xs truncate">${dateStr} · ${timeStr}</span>
    </div>
    <span class="text-xs font-medium px-2.5 py-1 rounded-full flex-shrink-0 ml-2 ${badgeCls}">${badgeLabel}</span>
  </div>

  <!-- Body -->
  <div class="flex flex-col sm:flex-row">

    <!-- Photo column -->
    <div class="sm:w-44 flex-shrink-0 p-4 pb-2 sm:pb-4">
      <img id="primary-${esc(p.id)}" src="${esc(primaryOpt.preview_url || '')}"
           class="w-full aspect-[4/5] object-cover rounded-xl shadow-sm bg-gray-100" />
      <div class="flex gap-1.5 mt-2 flex-wrap">${thumbs}</div>
    </div>

    <!-- Content column -->
    <div class="flex-1 px-4 pb-4 pt-0 sm:pt-4 sm:pl-1 flex flex-col min-w-0">

      <!-- Location -->
      <div class="flex items-center gap-1.5 mb-2">
        <span class="text-gray-400 text-xs flex-shrink-0">📍</span>
        <input id="loc-${esc(p.id)}" type="text" value="${esc(location)}" placeholder="Location…"
               class="text-xs text-gray-600 flex-1 min-w-0 border-b border-transparent hover:border-gray-300 focus:border-blue-400 outline-none bg-transparent"
               oninput="markLocChanged('${esc(p.id)}')" />
        <button id="loc-save-${esc(p.id)}" onclick="saveLocation('${esc(p.id)}')"
                class="text-xs text-blue-600 hover:text-blue-700 font-medium hidden whitespace-nowrap flex-shrink-0">
          Save & Regen
        </button>
      </div>

      <!-- Caption -->
      <textarea id="cap-${esc(p.id)}" rows="4"
                class="w-full text-sm text-gray-800 resize-none rounded-lg p-2 bg-gray-50 hover:bg-gray-100 focus:bg-white border border-transparent focus:border-blue-300 outline-none leading-relaxed transition"
                oninput="markCapChanged('${esc(p.id)}')">${esc(cap.caption || '')}</textarea>

      <!-- Hashtags -->
      <p id="tags-${esc(p.id)}" class="text-xs text-blue-400 mt-1 px-1 leading-relaxed">${esc(hashtags)}</p>

      ${musicHtml}

      <div class="flex-1"></div>

      <!-- Actions row -->
      <div class="flex items-center gap-2 mt-3 flex-wrap">
        <button id="cap-save-${esc(p.id)}" onclick="saveCaption('${esc(p.id)}')"
                class="text-xs px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium hidden transition">
          💾 Save
        </button>
        <button onclick="toggleRegen('${esc(p.id)}')"
                class="text-xs px-3 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg font-medium transition">
          ↺ Regenerate
        </button>
        <div class="flex-1"></div>
        ${actionBtns}
      </div>

      <!-- Regen form (hidden) -->
      <div id="regen-${esc(p.id)}" class="hidden mt-2">
        <div class="flex gap-2">
          <input id="regen-ctx-${esc(p.id)}" type="text"
                 placeholder="Optional hint: 'more poetic', 'focus on architecture'…"
                 class="flex-1 min-w-0 text-xs border border-gray-200 rounded-lg px-3 py-1.5 outline-none focus:border-purple-400 bg-white" />
          <button onclick="doRegen('${esc(p.id)}')" id="regen-btn-${esc(p.id)}"
                  class="flex-shrink-0 text-xs px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition">
            Generate
          </button>
          <button onclick="toggleRegen('${esc(p.id)}')"
                  class="flex-shrink-0 text-xs px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-500 transition">✕</button>
        </div>
      </div>

    </div>
  </div>
</div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────

async function approvePost(id) {
  const btn = document.getElementById('btn-approve-' + id);
  btn.disabled = true; btn.textContent = '…';
  const r = await apiFetch(API + '/approve/' + id, {method:'POST'});
  if (r.ok) {
    updateBadge(id, 'approved');
    btn.remove();
    toast('Post approved ✓');
  } else {
    btn.disabled = false; btn.textContent = '✓ Approve';
    toast('Error approving post', 'error');
  }
}

async function approveAll() {
  const btn = document.getElementById('approve-all-btn');
  btn.disabled = true; btn.textContent = '…';
  const r = await apiFetch(API + '/approve-all', {method:'POST'});
  btn.disabled = false; btn.textContent = '✓ Approve All';
  if (r.ok) { toast('All posts approved ✓'); loadPosts(); }
  else toast('Error', 'error');
}

async function skipPost(id) {
  if (!confirm('Skip this post? This cannot be undone.')) return;
  const r = await apiFetch(API + '/skip/' + id, {method:'POST'});
  if (r.ok) {
    const card = document.getElementById('card-' + id);
    card.classList.add('fade-out');
    toast('Post skipped');
    setTimeout(() => card.remove(), 500);
  } else toast('Error skipping post', 'error');
}

async function selectPhoto(postId, photoId) {
  const r = await apiFetch(API + '/select/' + postId + '/' + photoId, {method:'POST'});
  const data = await r.json();
  if (!data.ok) { toast(data.error || 'Error', 'error'); return; }

  // Swap primary image
  const opt = (postsCache[postId]?.options || []).find(o => o.photo_id === photoId);
  if (opt) document.getElementById('primary-' + postId).src = opt.preview_url;

  // Update ring on thumbnails
  const p = postsCache[postId];
  if (p) {
    p.options.forEach(o => {
      const thumb = document.getElementById('thumb-' + postId + '-' + o.photo_id);
      if (!thumb) return;
      if (o.photo_id === photoId) {
        thumb.classList.add('ring-selected'); thumb.classList.remove('opacity-60');
      } else {
        thumb.classList.remove('ring-selected'); thumb.classList.add('opacity-60');
      }
    });
    p.selected_photo_id = photoId;
  }

  // Update caption fields if returned
  if (data.caption) {
    document.getElementById('cap-' + postId).value = data.caption.caption || '';
    document.getElementById('loc-' + postId).value = data.caption.location_name || '';
    document.getElementById('tags-' + postId).textContent = (data.caption.hashtags || []).join(' ');
  }
  toast('Photo updated ✓');
}

async function doRegen(id) {
  const ctx = document.getElementById('regen-ctx-' + id).value;
  const btn = document.getElementById('regen-btn-' + id);
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">↺</span> Generating…';

  const r = await apiFetch(API + '/regen/' + id, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({context: ctx}),
  });
  const data = await r.json();
  btn.disabled = false; btn.textContent = 'Generate';

  if (data.ok && data.async) {
    toggleRegen(id);
    toast('Caption regenerating via GitHub Actions — check back in ~60s');
  } else if (data.ok) {
    document.getElementById('cap-' + id).value = data.caption.caption || '';
    document.getElementById('loc-' + id).value = data.caption.location_name || '';
    document.getElementById('tags-' + id).textContent = (data.caption.hashtags || []).join(' ');
    if (postsCache[id]) postsCache[id].caption = data.caption;
    toggleRegen(id);
    toast('Caption regenerated ✓');
  } else {
    toast(data.error || 'Regeneration failed', 'error');
  }
}

async function saveCaption(id) {
  const caption = document.getElementById('cap-' + id).value;
  const location = document.getElementById('loc-' + id).value;
  const existing = postsCache[id]?.caption || {};
  const r = await apiFetch(API + '/caption/' + id, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({caption, hashtags: existing.hashtags || [], location_name: location}),
  });
  if (r.ok) {
    document.getElementById('cap-save-' + id).classList.add('hidden');
    if (postsCache[id]) postsCache[id].caption = {...existing, caption, location_name: location};
    toast('Saved ✓');
  } else toast('Save failed', 'error');
}

async function saveLocation(id) {
  const location = document.getElementById('loc-' + id).value;
  const btn = document.getElementById('loc-save-' + id);
  btn.disabled = true; btn.textContent = '…';

  // Save location immediately
  const existing = postsCache[id]?.caption || {};
  await apiFetch(API + '/caption/' + id, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      caption: existing.caption || '',
      hashtags: existing.hashtags || [],
      location_name: location,
    }),
  });

  // Trigger regen with new location as context
  const regenCtx = document.getElementById('regen-ctx-' + id);
  if (regenCtx) regenCtx.value = location ? 'Location: ' + location : '';

  btn.disabled = false;
  btn.classList.add('hidden');
  document.getElementById('regen-' + id).classList.remove('hidden');
  toast('Location saved — click Generate to update caption');
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function toggleRegen(id) {
  document.getElementById('regen-' + id).classList.toggle('hidden');
}

function markCapChanged(id) {
  document.getElementById('cap-save-' + id).classList.remove('hidden');
}

function markLocChanged(id) {
  document.getElementById('loc-save-' + id).classList.remove('hidden');
}

function updateBadge(id, status) {
  const map = {
    approved: ['bg-green-100 text-green-700', '✓ Approved'],
    pending:  ['bg-yellow-100 text-yellow-700', '● Pending'],
    posted:   ['bg-blue-100 text-blue-700', '📤 Posted'],
  };
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const badge = card.querySelector('.rounded-full');
  if (!badge || !map[status]) return;
  badge.className = 'text-xs font-medium px-2.5 py-1 rounded-full flex-shrink-0 ml-2 ' + map[status][0];
  badge.textContent = map[status][1];
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'pointer-events-auto px-4 py-2 rounded-xl text-sm font-medium text-white shadow-lg ' +
    (type === 'error' ? 'bg-red-500' : 'bg-gray-800');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2500);
  setTimeout(() => el.remove(), 3000);
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
