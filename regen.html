<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regenerate Caption — InstaAutoPost</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .box { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.10); padding: 36px 40px; width: 100%; max-width: 460px; }
  .icon { font-size: 36px; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 700; color: #111827; margin: 0 0 6px; }
  p  { font-size: 13px; color: #6b7280; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  textarea {
    width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 14px;
    font-size: 14px; font-family: inherit; resize: vertical; min-height: 90px;
    color: #111827; outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  .btn-regen {
    display: block; width: 100%; margin-top: 16px; padding: 13px;
    background: #6366f1; color: #fff; font-size: 15px; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .btn-regen:hover { background: #4f46e5; }
  .btn-regen:disabled { background: #a5b4fc; cursor: not-allowed; }
  .btn-skip { display: block; text-align: center; margin-top: 12px; font-size: 13px; color: #9ca3af; text-decoration: none; }
  .btn-skip:hover { color: #ef4444; }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">✏️</div>
  <h1>Regenerate Caption</h1>
  <p>Optionally add context to guide the new caption — location details, mood, what's in the photo. Leave blank to let Claude pick freely.</p>

  <label for="ctx">Context (optional)</label>
  <textarea id="ctx" placeholder="e.g. Sunset at the Grand Canyon, golden hour, feeling of vastness..."></textarea>
  <p class="hint">This won't appear in the caption — it's just a hint for the AI.</p>

  <button class="btn-regen" id="btn" onclick="submit()">↻ Regenerate Caption</button>
  <a id="skip-link" class="btn-skip">Skip this post instead</a>
</div>

<script>
  const EDGE = "https://jmqwlytekusvcrgobitw.supabase.co/functions/v1/approval-handler";
  const p    = new URLSearchParams(location.search);
  const postId = p.get("post_id") || "";

  if (p.get("skip_url")) {
    document.getElementById("skip-link").href = p.get("skip_url");
  } else if (postId) {
    document.getElementById("skip-link").href = `${EDGE}/api/skip/${postId}`;
  }

  function submit() {
    const ctx = document.getElementById("ctx").value.trim();
    const btn = document.getElementById("btn");
    btn.disabled = true;
    btn.textContent = "Sending…";
    const url = `${EDGE}/api/regen/${postId}` + (ctx ? `?context=${encodeURIComponent(ctx)}` : "");
    window.location.href = url;
  }
</script>
</body>
</html>
