<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstaAutoPost</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5;margin:0;padding:20px;box-sizing:border-box}
  .box{background:#fff;padding:40px 48px;border-radius:16px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.10);max-width:420px;width:100%}
  .icon{font-size:52px;margin-bottom:16px}
  h1{font-size:24px;margin:0 0 10px;font-weight:700}
  p{color:#6b7280;margin:0;font-size:15px;line-height:1.5}
  .ok h1{color:#16a34a}
  .warn h1{color:#d97706}
  .err h1{color:#dc2626}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Loading…</h1>
  <p id="msg"></p>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var type = p.get('t') || 'ok';
  var title = p.get('h') || 'Done';
  var msg = p.get('m') || '';
  var icons = {ok:'✅', warn:'🚫', err:'❌'};
  document.getElementById('box').className = 'box ' + type;
  document.getElementById('icon').textContent = icons[type] || '✅';
  document.getElementById('title').textContent = title;
  document.getElementById('msg').textContent = msg;
  document.title = title + ' — InstaAutoPost';
</script>
</body>
</html>
